<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЯМА — кастомные матчи Deadlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=1c7024337c">
</head>
<body>
<div class="ticker label" id="ticker"></div>
<header class="mast">
  <a class="logo" href="#/">
    <b id="logoName">ЯМ<i>А</i></b>
    <small class="label" id="logoSub">кастомные матчи Deadlock</small>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="me" id="me"></div>
</header>
<div class="rule"></div>

<div class="shell">
  <main>
    <p class="notice" id="notice" hidden></p>
    <p class="error" id="error"></p>
    <div id="view"></div>
  </main>
  <aside class="rail" id="rail">
    <div class="rail-head">
      <h2 class="h3" id="chatTitle">Чат</h2>
      <button class="rail-close" id="railClose" onclick="toggleRail(false)" aria-label="Закрыть чат">×</button>
    </div>
    <div class="rail-tabs" id="railTabs"></div>
    <ol class="msgs" id="msgs"></ol>
    <form class="say" onsubmit="sendChat(event)">
      <input id="say" maxlength="300" placeholder="Написать…" autocomplete="off">
      <button id="sayButton" aria-label="Отправить">→</button>
    </form>
  </aside>
</div>
<button class="btn chat-fab" id="chatFab" onclick="toggleRail(true)">Чат</button>

<footer>
  <span id="footNote">ЯМА — фанатский сайт кастомных матчей. Не связан с Valve.</span>
  <span class="label">Deadlock © Valve Corporation</span>
</footer>

<script>document.write('<script src="/static/config.js?v=' + Date.now() + '"><\/script>')</script>
<script src="/static/app.js?v=1c7024337c"></script>
</body>
</html>
